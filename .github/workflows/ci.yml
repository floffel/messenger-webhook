name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo test --no-default-features
      # Feature matrix: every feature has to stand on its own, because a
      # consumer may enable exactly one provider.
      - run: cargo test --no-default-features --features whatsapp
      - run: cargo test --no-default-features --features telegram
      - run: cargo test --no-default-features --features matrix
      # The README points at both examples: run the framework-free one and make
      # sure the Axum one at least links, so neither rots into decoration.
      - run: cargo run --example minimal --features whatsapp
      - run: cargo build --example axum_handler --features whatsapp
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      # No --locked on purpose: this crate is a library, so the lockfile is not
      # shipped and an MSRV user resolves fresh. A dependency that raises its
      # floor therefore fails here instead of in the wild.
      - name: MSRV build, all features
        run: cargo check --all-features
      - name: MSRV build, no default features
        run: cargo check --no-default-features
      - name: MSRV test build (dev-dependencies included)
        run: cargo test --all-features --no-run

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      # Mirrors the docs.rs build: all features plus the docsrs cfg that turns
      # on the per-item feature badges. RUSTDOCFLAGS "-D warnings" catches
      # intra-doc links that only break with a feature-gated item missing.
      - name: docs.rs build
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Coverage gate (lines >= 95%)
        run: cargo llvm-cov --all-features --fail-under-lines 95 --summary-only

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: cargo-fuzz is on PATH
        run: cargo fuzz --version
      # cargo-fuzz defaults to the musl target on Linux, where ASan needs a
      # dynamically linked libc; pin the gnu target instead.
      - name: Build the normalize target
        run: cargo fuzz build --target x86_64-unknown-linux-gnu normalize
      - name: Run the committed corpus
        run: cargo fuzz run --target x86_64-unknown-linux-gnu normalize -- -runs=5000

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
