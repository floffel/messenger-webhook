name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo test --no-default-features

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $crate"
            exit 1
          fi
      # A version on crates.io is immutable: re-running a release for a version
      # that already exists must be a no-op, not a red build.
      - name: Version already published?
        id: registry
        run: |
          meta=$(cargo metadata --no-deps --format-version 1)
          name=$(printf '%s' "$meta" | jq -r '.packages[0].name')
          version=$(printf '%s' "$meta" | jq -r '.packages[0].version')
          status=$(curl -s -o /dev/null -w '%{http_code}' -A "release-ci ($GITHUB_REPOSITORY)" \
            "https://crates.io/api/v1/crates/$name/$version")
          case "$status" in
            200)
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "::notice::$name $version is already on crates.io - nothing to publish"
              ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::crates.io lookup for $name $version returned HTTP $status"
              exit 1
              ;;
          esac
      - name: Registry token present
        if: steps.registry.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set for this repository - refusing to publish"
            exit 1
          fi
      - if: steps.registry.outputs.published == 'false'
        run: cargo publish --dry-run
      - if: steps.registry.outputs.published == 'false'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
