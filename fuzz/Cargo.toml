[package]
name = "messenger-webhook-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.messenger-webhook]
path = ".."
features = ["whatsapp", "telegram", "matrix", "matrix-out"]

[[bin]]
name = "normalize"
path = "fuzz_targets/normalize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "outbound_ids"
path = "fuzz_targets/outbound_ids.rs"
test = false
doc = false
bench = false

[[bin]]
name = "subscription"
path = "fuzz_targets/subscription.rs"

[[bin]]
name = "verify_meta"
path = "fuzz_targets/verify_meta.rs"

[[bin]]
name = "rich_offsets"
path = "fuzz_targets/rich_offsets.rs"
test = false
doc = false
bench = false
