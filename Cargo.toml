[package]
name = "messenger-webhook"
version = "0.3.3"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0 OR MIT"
description = "Normalise messenger webhooks (WhatsApp, Telegram, Matrix) into one common message type and encode them back"
repository = "https://github.com/floffel/messenger-webhook"
documentation = "https://docs.rs/messenger-webhook"
keywords = ["webhook", "messaging", "whatsapp", "telegram", "normalisation"]
categories = ["web-programming", "api-bindings"]
readme = "README.md"
exclude = [".github/**", "deny.toml", "fuzz/**"]

[features]
default = ["whatsapp", "telegram", "matrix"]
# `form_urlencoded` parses the subscription handshake's query string, so the
# dependency belongs to this feature and to no other one.
whatsapp = ["dep:form_urlencoded"]
telegram = []
matrix = ["dep:html5ever"]
# Default-off: a Matrix outbound client drags in an HTTP stack (reqwest) and a
# runtime (tokio's sync + time primitives). A webhook-only consumer must not
# inherit either, so the whole `matrix_out` module sits behind this feature.
matrix-out = [
    "dep:exponential-backoff",
    "dep:futures-util",
    "dep:moka",
    "dep:percent-encoding",
    "dep:reqwest",
    "dep:tokio",
    "dep:url",
    "dep:uuid",
]
# Default-off: this mirrors a downstream consumer enabling `serde_json`'s
# `preserve_order` feature. The crate's synthetic ids stay stable either way,
# but CI must build and test the `IndexMap` implementation too.
preserve_order = ["serde_json/preserve_order"]

[dependencies]
serde_json = "1"
serde_json_canonicalizer = "0.4.1"
sha2 = "0.11"
hmac = "0.13"
const-hex = { version = "1.19.3", default-features = false, features = ["alloc"] }
subtle = "2"
zeroize = "1"
thiserror = "2"
strum = { version = "0.28.0", features = ["derive"] }
# One HTTP stack, one TLS backend: rustls, so no OpenSSL build. `json` is off on
# purpose - the crate serialises with serde_json itself and sends bytes, which
# keeps the transport dumb and the wire shape under this crate's control.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "stream",
], optional = true }
# `reqwest::Response::bytes_stream` has the stream; `TryStreamExt::try_fold`
# bounds the body before it can grow without limit.
futures-util = { version = "0.3", default-features = false, features = [
    "std",
], optional = true }
# Only the primitives the outbound client needs: an async mutex for per-room
# ordering and a timer for backoff. No runtime, no macros: the client drives on
# whatever executor the caller already has.
tokio = { version = "1", default-features = false, features = [
    "sync",
    "time",
], optional = true }
# Bounded async cache for per-room ordering gates. The `future` feature provides
# the async cache API and keeps the sync cache out of the default-off path.
moka = { version = "0.12", default-features = false, features = [
    "future",
], optional = true }
# Parses `application/x-www-form-urlencoded` query strings: `+` is a space,
# `%` needs decoding and a key may legally repeat. The Meta handshake is the one
# place this crate reads a query string.
form_urlencoded = { version = "1", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
# WHATWG URL parsing for the homeserver base URL: an origin plus an optional
# path prefix, without userinfo, query or fragment.
url = { version = "2.5.8", optional = true }
# `RetryPolicy` uses the crate's deterministic iterator for `backoff()` and its
# default jittered iterator for runtime retry decisions, so the exponential
# schedule and jitter stay maintained code.
exponential-backoff = { version = "2.1.1", optional = true }
# A provider id of " " or U+200B names nothing, and `char::is_control`
# misses format characters such as U+200B either way: the general
# category is the tool that tells a real id from a placeholder.
# `char::is_whitespace` alone cannot (`Cf` code points are not
# whitespace). Pure data table, no code, `no_std`, Apache-2.0.
unicode-general-category = "1.1.0"
# Percent-encodes Matrix URL path segments and query values. Already in the
# tree through reqwest/form_urlencoded; direct because rustc needs the path.
percent-encoding = { version = "2.3.2", default-features = false, features = [
    "alloc",
], optional = true }
# WHATWG HTML5 tokenizer for Matrix `formatted_body`. The crate only uses
# the tokenizer, not the tree builder, so the parser is bounded before any DOM
# exists; MIT OR Apache-2.0, Servo html5ever, last updated 2026-09-14.
html5ever = { version = "0.40.1", optional = true }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
proptest = "1"
# Only `examples/axum_handler.rs` needs an HTTP stack; the crate itself stays
# free of one, which is why axum lives here and not in `[dependencies]`.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }

# An example that needs a feature is only built when that feature is on, so the
# `--no-default-features` job does not try to compile it.
[[example]]
name = "minimal"
required-features = ["whatsapp"]

[[example]]
name = "axum_handler"
required-features = ["whatsapp"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
